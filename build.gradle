// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Use a version of the Android Gradle Plugin that is compatible with the user's environment.
        // 7.0.0 is a safe bet for compatibility with modern Android Studio and AIDE.
        classpath 'com.android.tools.build:gradle:7.0.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
